<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photography and writing by Mitong Li.">
    <title>Mitong Li</title>

    <style>
        :root {
            color-scheme: light;
            --page-width: 716px;
            --text: #222;
            --muted: #777;
            --line: #dedede;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #fff;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            font-weight: 400;
        }

        a { color: inherit; text-decoration: none; }
        button { font: inherit; }

        .site {
            width: min(var(--page-width), calc(100% - 40px));
            margin: 0 auto;
        }

        header {
            min-height: 58px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .site-name {
            flex: 0 0 auto;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 23px;
        }

        nav a {
            color: #555;
            transition: color .15s ease;
        }

        nav a:hover,
        nav a.active { color: #000; }

        nav a:focus-visible,
        button:focus-visible,
        .project:focus-visible {
            outline: 1px solid #555;
            outline-offset: 4px;
        }

        main {
            min-height: 220px;
            padding-top: 62px;
            padding-bottom: 100px;
        }

        /* Photography directory */
        .directory {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            column-gap: 54px;
            row-gap: 28px;
            align-items: start;
        }

        .project {
            min-width: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .project-image {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f4f4f4;
        }

        .project-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity .2s ease;
        }

        .project:hover .project-image img { opacity: .82; }

        .project-title {
            margin-top: 9px;
            color: #444;
            font-size: 11px;
            line-height: 1.4;
        }

        .empty-state,
        .load-error {
            color: #777;
            font-size: 12px;
            line-height: 1.8;
        }

        /* Photograph viewer */
        .viewer { width: 100%; text-align: center; }

        .photo-wrapper {
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
        }

        .photo-wrapper img {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .photo-info {
            width: 100%;
            margin-top: 12px;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.7;
            text-align: right;
        }

        .photo-navigation,
        .writing-navigation {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .photo-navigation button,
        .writing-navigation button,
        .back-link {
            border: 0;
            padding: 0;
            background: transparent;
            color: #555;
            cursor: pointer;
            font-size: 11px;
        }

        .photo-navigation button:hover,
        .writing-navigation button:hover,
        .back-link:hover { color: #000; }

        .photo-navigation button:disabled,
        .writing-navigation button:disabled {
            color: #ccc;
            cursor: default;
        }

        .viewer-back { margin-top: 22px; }

        /* Writing */
        .writing-viewer {
            max-width: 540px;
            margin: 0 auto;
        }

        .writing-content {
            color: #333;
            font-size: 13px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .writing-content > :first-child { margin-top: 0; }

        .writing-content h1,
        .writing-content h2,
        .writing-content h3,
        .writing-content h4 {
            color: #222;
            font-weight: 600;
            line-height: 1.45;
            margin: 1.8em 0 .7em;
        }

        .writing-content h1 { font-size: 21px; }
        .writing-content h2 { font-size: 17px; }
        .writing-content h3 { font-size: 14px; }
        .writing-content h4 { font-size: 13px; }
        .writing-content p { margin: 0 0 1.15em; }
        .writing-content strong { font-weight: 700; color: #222; }
        .writing-content em { font-style: italic; }

        .writing-content ul,
        .writing-content ol {
            padding-left: 1.6em;
            margin: 0 0 1.2em;
        }

        .writing-content li { padding-left: .2em; margin: .25em 0; }

        .writing-content blockquote {
            margin: 1.5em 0;
            padding: 0 0 0 16px;
            border-left: 1px solid #ccc;
            color: #777;
        }

        .writing-content blockquote > :last-child { margin-bottom: 0; }

        .writing-content a {
            color: #333;
            text-decoration: underline;
            text-decoration-color: #bbb;
            text-underline-offset: 2px;
        }

        .writing-content a:hover { color: #000; text-decoration-color: #333; }
        .writing-content hr { border: 0; border-top: 1px solid #e3e3e3; margin: 2em 0; }

        .writing-content code {
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: .88em;
            background: #f5f5f5;
            padding: 2px 4px;
        }

        .writing-content pre {
            overflow-x: auto;
            padding: 13px 15px;
            background: #f7f7f7;
            line-height: 1.65;
        }

        .writing-content pre code { padding: 0; background: transparent; }

        .writing-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1.5em auto;
        }

        .writing-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            font-size: 12px;
        }

        .writing-content th,
        .writing-content td {
            border-bottom: 1px solid #e5e5e5;
            padding: 7px 9px;
            text-align: left;
        }

        .writing-status {
            color: #888;
            font-size: 11px;
            text-align: center;
            padding: 30px 0;
        }

        .writing-error { color: #777; font-size: 12px; line-height: 1.7; }
        .writing-navigation { margin-top: 42px; }

        @media (max-width: 600px) {
            .site { width: calc(100% - 36px); }
            header { gap: 18px; }
            nav { gap: 14px; }
            .directory {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                column-gap: 24px;
                row-gap: 28px;
            }
            .project-image { height: 105px; }
            main { padding-top: 38px; }
            .photo-wrapper img { max-height: 65vh; }
        }

        @media (max-width: 360px) {
            header { gap: 12px; }
            nav { gap: 10px; }
            .site-name { font-size: 13px; }
            nav a { font-size: 11px; }
        }
    </style>
</head>

<body>
    <div class="site">
        <header>
            <a class="site-name" href="#photography" id="home-link">Mitong Li</a>
            <nav aria-label="Main navigation">
                <a href="#photography" id="nav-photography">Photography</a>
                <a href="#writing" id="nav-writing">Writing</a>
            </nav>
        </header>

        <main id="main" aria-live="polite">
            <p class="writing-status">Loading content...</p>
        </main>
    </div>

    <!-- Markdown renderer and sanitizer -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.2.1/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.5.0/dist/purify.min.js"></script>

    <script>
        "use strict";

        /*
         * Content is generated by build_index.py.
         * Add photos to image/<project>/ and Markdown files to writing/.
         * Do not edit the project/article lists here.
         */

        const CONTENT_INDEX = "./content.json";
        const main = document.getElementById("main");

        let content = { projects: [], writings: [] };
        let currentPage = "directory";
        let currentProject = null;
        let currentPhotoIndex = 0;
        let currentWritingIndex = 0;
        let writingRequestId = 0;

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        function setActiveNav(page) {
            document.getElementById("nav-photography").classList.toggle("active", page === "photography");
            document.getElementById("nav-writing").classList.toggle("active", page === "writing");
        }

        function showPhotography() {
            currentPage = "directory";
            currentProject = null;
            writingRequestId++;
            setActiveNav("photography");

            if (!content.projects.length) {
                main.innerHTML = '<p class="empty-state">No photography projects found. Add folders and photographs under <code>image/</code>, then run <code>python3 build_index.py</code>.</p>';
                window.scrollTo(0, 0);
                return;
            }

            const cards = content.projects.map(project => `
                <button class="project" type="button" data-project-id="${escapeHTML(project.id)}" aria-label="Open ${escapeHTML(project.title)}">
                    <span class="project-image">
                        <img src="${escapeHTML(project.cover)}" alt="${escapeHTML(project.title)}" loading="lazy">
                    </span>
                    <span class="project-title">${escapeHTML(project.title)}</span>
                </button>
            `).join("");

            main.innerHTML = `<div class="directory">${cards}</div>`;
            window.scrollTo(0, 0);
        }

        function openProject(projectId) {
            const project = content.projects.find(item => item.id === projectId);
            if (!project || !project.photographs.length) return;

            currentProject = project;
            currentPhotoIndex = 0;
            showPhoto();
        }

        function showPhoto() {
            if (!currentProject) return;
            currentPage = "photo";
            setActiveNav("photography");

            const photographs = currentProject.photographs;
            const photo = photographs[currentPhotoIndex];
            const info = photo.info || currentProject.info || "";

            main.innerHTML = `
                <section class="viewer" aria-label="Photograph viewer">
                    <div class="photo-wrapper">
                        <img src="${escapeHTML(photo.src)}" alt="${escapeHTML(photo.alt || currentProject.title)}">
                        ${info ? `<div class="photo-info">${escapeHTML(info)}</div>` : ""}
                    </div>
                    <div class="photo-navigation">
                        <button type="button" data-action="previous-photo" ${currentPhotoIndex === 0 ? "disabled" : ""}>Previous</button>
                        <button type="button" data-action="next-photo" ${currentPhotoIndex === photographs.length - 1 ? "disabled" : ""}>Next</button>
                    </div>
                </section>
            `;
            window.scrollTo(0, 0);
        }

        function previousPhoto() {
            if (currentProject && currentPhotoIndex > 0) {
                currentPhotoIndex--;
                showPhoto();
            }
        }

        function nextPhoto() {
            if (currentProject && currentPhotoIndex < currentProject.photographs.length - 1) {
                currentPhotoIndex++;
                showPhoto();
            }
        }

        function showWriting() {
            currentPage = "writing";
            currentWritingIndex = 0;
            setActiveNav("writing");
            showWritingArticle();
        }

        async function showWritingArticle() {
            currentPage = "writing";
            setActiveNav("writing");

            const writing = content.writings[currentWritingIndex];
            if (!writing) {
                main.innerHTML = '<p class="empty-state">No Markdown articles found. Add <code>.md</code> files to <code>writing/</code>, then run <code>python3 build_index.py</code>.</p>';
                return;
            }

            const requestId = ++writingRequestId;
            const navigation = `
                <div class="writing-navigation">
                    <button class="back-link" type="button" data-action="previous-writing" ${currentWritingIndex === 0 ? "disabled" : ""}>Previous</button>
                    <button class="back-link" type="button" data-action="next-writing" ${currentWritingIndex === content.writings.length - 1 ? "disabled" : ""}>Next</button>
                </div>
            `;

            main.innerHTML = `
                <div class="writing-viewer">
                    <article class="writing-content"><p class="writing-status">Loading...</p></article>
                    ${navigation}
                </div>
            `;
            window.scrollTo(0, 0);

            try {
                const response = await fetch(writing.file, { cache: "no-cache" });
                if (!response.ok) throw new Error(`Could not load ${writing.file} (${response.status})`);

                const markdown = await response.text();
                if (requestId !== writingRequestId || currentPage !== "writing") return;

                if (!window.marked || !window.DOMPurify) {
                    throw new Error("The Markdown libraries could not be loaded. Check CDN access or your internet connection.");
                }

                const renderedHTML = window.marked.parse(markdown, { gfm: true, breaks: false });
                const safeHTML = window.DOMPurify.sanitize(renderedHTML, { USE_PROFILES: { html: true } });

                const article = main.querySelector(".writing-content");
                if (article) article.innerHTML = safeHTML;
            } catch (error) {
                if (requestId !== writingRequestId) return;
                console.error(error);
                const article = main.querySelector(".writing-content");
                if (article) {
                    article.innerHTML = `<p class="writing-error">Unable to load this article. Check that <code>${escapeHTML(writing.file)}</code> exists and that the site is served over HTTP/HTTPS.</p>`;
                }
            }
        }

        function previousWriting() {
            if (currentWritingIndex > 0) {
                currentWritingIndex--;
                showWritingArticle();
            }
        }

        function nextWriting() {
            if (currentWritingIndex < content.writings.length - 1) {
                currentWritingIndex++;
                showWritingArticle();
            }
        }

        // Event delegation keeps generated content free of inline event handlers.
        main.addEventListener("click", event => {
            const projectButton = event.target.closest("[data-project-id]");
            if (projectButton) {
                openProject(projectButton.dataset.projectId);
                return;
            }

            const actionButton = event.target.closest("[data-action]");
            if (!actionButton) return;

            switch (actionButton.dataset.action) {
                case "previous-photo": previousPhoto(); break;
                case "next-photo": nextPhoto(); break;
                case "previous-writing": previousWriting(); break;
                case "next-writing": nextWriting(); break;
            }
        });

        document.getElementById("nav-photography").addEventListener("click", event => {
            event.preventDefault();
            showPhotography();
        });

        document.getElementById("nav-writing").addEventListener("click", event => {
            event.preventDefault();
            showWriting();
        });

        document.getElementById("home-link").addEventListener("click", event => {
            event.preventDefault();
            showPhotography();
        });

        document.addEventListener("keydown", event => {
            const tag = document.activeElement?.tagName;
            if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || document.activeElement?.isContentEditable) return;

            if (currentPage === "photo") {
                if (event.key === "ArrowLeft") previousPhoto();
                if (event.key === "ArrowRight") nextPhoto();
            } else if (currentPage === "writing" && !event.metaKey && !event.ctrlKey && !event.altKey) {
                if (event.key === "ArrowLeft") {
                    event.preventDefault();
                    previousWriting();
                }
                if (event.key === "ArrowRight") {
                    event.preventDefault();
                    nextWriting();
                }
            }
        });

        async function initializeSite() {
            try {
                const response = await fetch(CONTENT_INDEX, { cache: "no-cache" });
                if (!response.ok) throw new Error(`Could not load content.json (${response.status})`);
                const data = await response.json();

                content = {
                    projects: Array.isArray(data.projects) ? data.projects : [],
                    writings: Array.isArray(data.writings) ? data.writings : []
                };
                showPhotography();
            } catch (error) {
                console.error(error);
                main.innerHTML = `
                    <div class="load-error">
                        <p>Unable to load the content index.</p>
                        <p>Run <code>python3 build_index.py</code> in the website folder to create <code>content.json</code>, then reload this page.</p>
                        <p>Details: ${escapeHTML(error.message)}</p>
                    </div>
                `;
            }
        }

        initializeSite();
    </script>
</body>
</html>
