<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitong Li</title>

    <style>
        /* =========================
   BASIC
========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            font-weight: 400;
        }

        a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            font: inherit;
        }

        /* =========================
   MAIN LAYOUT
========================= */

        .site {
            width: min(716px, calc(100% - 40px));
            margin: 0 auto;
        }

        header {
            height: 58px;
            border-bottom: 1px solid #dedede;
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .site-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 23px;
        }

        nav a {
            color: #555;
            transition: color 0.15s ease;
        }

        nav a:hover,
        nav a.active {
            color: #000;
        }

        main {
            padding-top: 62px;
            padding-bottom: 100px;
        }

        /* =========================
   PHOTOGRAPHY DIRECTORY
========================= */

        .directory {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 54px;
            row-gap: 28px;
            align-items: start;
        }

        .project {
            cursor: pointer;
            min-width: 0;
        }

        .project-image {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f4f4f4;
        }

        .project-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s ease;
        }

        .project:hover .project-image img {
            opacity: 0.82;
        }

        .project-title {
            margin-top: 9px;
            color: #444;
            font-size: 11px;
            line-height: 1.4;
        }

        /* =========================
   PHOTO VIEWER
========================= */

        .viewer {
            width: 100%;
            text-align: center;
        }

        .viewer-heading {
            margin: 0 0 30px;
            font-size: 12px;
            font-weight: 400;
            color: #444;
        }

        .photo-stage {
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }

        .photo-stage img {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .photo-info {
            width: fit-content;
            max-width: 100%;
            margin: 12px auto 0;
            color: #777;
            font-size: 10px;
            line-height: 1.7;
            text-align: right;
        }

        .photo-wrapper {
            width: fit-content;
            max-width: 100%;
        }

        .photo-wrapper img {
            display: block;
            max-width: 100%;
            max-height: 70vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .photo-info {
            width: 100%;
            margin-top: 12px;
            text-align: right;
            color: #777;
            font-size: 10px;
            line-height: 1.7;
        }

        .photo-navigation {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .photo-navigation button,
        .back-link {
            border: 0;
            padding: 0;
            background: transparent;
            color: #555;
            cursor: pointer;
            font-size: 11px;
        }

        .photo-navigation button:hover,
        .back-link:hover {
            color: #000;
        }

        .photo-navigation button:disabled {
            color: #ccc;
            cursor: default;
        }

        .viewer-back {
            margin-top: 22px;
        }

        /* =========================
   WRITING
========================= */

        .writing-viewer {
            max-width: 540px;
            margin: 0 auto;
        }

        .writing-content {
            color: #333;
            font-size: 13px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .writing-content > :first-child {
            margin-top: 0;
        }

        .writing-content h1,
        .writing-content h2,
        .writing-content h3,
        .writing-content h4 {
            color: #222;
            font-weight: 600;
            line-height: 1.45;
            margin: 1.8em 0 0.7em;
        }

        .writing-content h1 { font-size: 21px; }
        .writing-content h2 { font-size: 17px; }
        .writing-content h3 { font-size: 14px; }
        .writing-content h4 { font-size: 13px; }

        .writing-content p {
            margin: 0 0 1.15em;
        }

        .writing-content strong {
            font-weight: 700;
            color: #222;
        }

        .writing-content em {
            font-style: italic;
        }

        .writing-content ul,
        .writing-content ol {
            padding-left: 1.6em;
            margin: 0 0 1.2em;
        }

        .writing-content li {
            padding-left: 0.2em;
            margin: 0.25em 0;
        }

        .writing-content blockquote {
            margin: 1.5em 0;
            padding: 0 0 0 16px;
            border-left: 1px solid #ccc;
            color: #777;
        }

        .writing-content blockquote > :last-child {
            margin-bottom: 0;
        }

        .writing-content a {
            color: #333;
            text-decoration: underline;
            text-decoration-color: #bbb;
            text-underline-offset: 2px;
        }

        .writing-content a:hover {
            color: #000;
            text-decoration-color: #333;
        }

        .writing-content hr {
            border: 0;
            border-top: 1px solid #e3e3e3;
            margin: 2em 0;
        }

        .writing-content code {
            font-family: Menlo, Monaco, Consolas, monospace;
            font-size: 0.88em;
            background: #f5f5f5;
            padding: 2px 4px;
        }

        .writing-content pre {
            overflow-x: auto;
            padding: 13px 15px;
            background: #f7f7f7;
            line-height: 1.65;
        }

        .writing-content pre code {
            padding: 0;
            background: transparent;
        }

        .writing-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 1.5em auto;
        }

        .writing-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            font-size: 12px;
        }

        .writing-content th,
        .writing-content td {
            border-bottom: 1px solid #e5e5e5;
            padding: 7px 9px;
            text-align: left;
        }

        .writing-status {
            color: #888;
            font-size: 11px;
            text-align: center;
            padding: 30px 0;
        }

        .writing-error {
            color: #777;
            font-size: 12px;
            line-height: 1.7;
        }

        .writing-navigation {
            margin-top: 42px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        /* =========================
   RESPONSIVE
========================= */

        @media (max-width: 600px) {
            .site {
                width: calc(100% - 36px);
            }

            header {
                gap: 18px;
            }

            nav {
                gap: 14px;
            }

            .directory {
                grid-template-columns: repeat(2, 1fr);
                column-gap: 24px;
                row-gap: 28px;
            }

            .project-image {
                height: 105px;
            }

            main {
                padding-top: 38px;
            }

            .photo-stage {
                min-height: 220px;
            }

            .photo-stage img {
                max-height: 65vh;
            }
        }

        @media (max-width: 360px) {
            header {
                gap: 12px;
            }

            nav {
                gap: 10px;
            }

            .site-name {
                font-size: 13px;
            }

            nav a {
                font-size: 11px;
            }
        }
    </style>
</head>

            /*

            {

                    }

        ];


        /* ==================================================
           WRITING DATABASE

           Each article is a separate Markdown (.md) file.
           Put the files in the /writing folder and list them here.
        ================================================== */

        const writings = [
            {
                title: "The Rise of Fascism",
                file: "./writing/112425theRiseOfFascism.md"
            },
            {
                title: "Fight For Authenticity",
                file: "./writing/060326fightForAuthenticity.md"
            },
            {
                title: "About Slavery",
                file: "./writing/110426SlaveryWhiteDegrade.md"
            },
            {
                title: "Reichfürher",
                file: "./writing/110526jokesAboutHitler.md"
            },
            {
                title: "About Trump's Midterm",
                file: "./writing/110526TurmpMidterm.md"
            },
            {
                title: "Hongkong and Greece",
                file: "./writing/110726HK&Greece.md"
            },
            {
                title: "Midterm exam R over",
                file: "./writing/111126midtermsROver.md"
            },
            {
                title: "Russo Nazi Polka",
                file: "./writing/111126RussoNaziPolka.md"
            },
            {
                title: "Underworld",
                file: "./writing/111726criminalUnderworld.md"
            },
            {
                title: "MamdaniDisbandingSRG",
                file: "./writing/111726Mamdani&SRG.md"
            },
        ];


        /* ==================================================
           STATE
        ================================================== */

        let currentPage = "directory";
        let currentProject = null;
        let currentPhotoIndex = 0;
        let currentWritingIndex = 0;

        const main = document.getElementById("main");


        /* ==================================================
           NAVIGATION HELPERS
        ================================================== */

        function setActiveNav(page) {

            document.getElementById("nav-photography")
                .classList.toggle("active", page === "photography");

            document.getElementById("nav-writing")
                .classList.toggle("active", page === "writing");
        }


        /* ==================================================
           PHOTOGRAPHY DIRECTORY
        ================================================== */

        function showPhotography() {

            currentPage = "directory";
            currentProject = null;

            setActiveNav("photography");

            let html = `<div class="directory">`;

            projects.forEach(project => {

                html += `
            <div class="project"
                 onclick="openProject('${project.id}')">

                <div class="project-image">
                    <img
                        src="${project.cover}"
                        alt="${project.title}"
                        loading="lazy"
                    >
                </div>

                <div class="project-title">
                    ${project.title}
                </div>

            </div>
        `;
            });

            html += `</div>`;

            main.innerHTML = html;

            window.scrollTo(0, 0);
        }


        /* ==================================================
           OPEN A PROJECT
        ================================================== */

        function openProject(projectId) {

            currentProject = projects.find(
                project => project.id === projectId
            );

            if (!currentProject) return;

            currentPhotoIndex = 0;

            showPhoto();
        }


        /* ==================================================
           PHOTO VIEWER
        ================================================== */

        function showPhoto() {

            currentPage = "photo";

            setActiveNav("photography");

            const photographs = currentProject.photographs;

            const photo = photographs[currentPhotoIndex];

            const info = [photo.info].filter(Boolean).join(" · ");

            main.innerHTML = `

        <div class="viewer">

            <div class="photo-stage">
                <div class="photo-wrapper">
                    <img src="${photo.src}" alt="">

                    ${info ? `
                        <div class="photo-info">${info}</div>
                    ` : ""}
                </div>
            </div>

            <div class="photo-navigation">

                <button
                    onclick="previousPhoto()"
                    ${currentPhotoIndex === 0 ? "disabled" : ""}
                >
                    Previous
                </button>

                <button
                    onclick="nextPhoto()"
                    ${currentPhotoIndex === photographs.length - 1 ? "disabled" : ""}
                >
                    Next
                </button>

            </div>

        </div>

    `;

            window.scrollTo(0, 0);
        }


        /* ==================================================
           PREVIOUS / NEXT PHOTOGRAPH
        ================================================== */

        function previousPhoto() {

            if (currentPhotoIndex > 0) {
                currentPhotoIndex--;
                showPhoto();
            }
        }

        function nextPhoto() {

            if (
                currentProject &&
                currentPhotoIndex < currentProject.photographs.length - 1
            ) {
                currentPhotoIndex++;
                showPhoto();
            }
        }


        /* ==================================================
           WRITING VIEWER

           Fetch the selected Markdown file, convert it to HTML,
           then sanitize the result before inserting it into the page.
        ================================================== */

        let writingRequestId = 0;

        function showWriting() {
            currentPage = "writing";
            setActiveNav("writing");
            currentWritingIndex = 0;
            showWritingArticle();
        }

        async function showWritingArticle() {
            currentPage = "writing";
            setActiveNav("writing");

            const writing = writings[currentWritingIndex];
            if (!writing) {
                main.innerHTML = "";
                return;
            }

            const requestId = ++writingRequestId;

            main.innerHTML = `
                <div class="writing-viewer">
                    <div class="writing-content">
                        <p class="writing-status">Loading...</p>
                    </div>
                    <div class="writing-navigation">
                        <button class="back-link" onclick="previousWriting()"
                            ${currentWritingIndex === 0 ? "disabled" : ""}>Previous</button>
                        <button class="back-link" onclick="nextWriting()"
                            ${currentWritingIndex === writings.length - 1 ? "disabled" : ""}>Next</button>
                    </div>
                </div>
            `;

            window.scrollTo(0, 0);

            try {
                const response = await fetch(writing.file);
                if (!response.ok) {
                    throw new Error(`Could not load ${writing.file} (${response.status})`);
                }

                const markdown = await response.text();

                if (requestId !== writingRequestId || currentPage !== "writing") return;

                if (!window.marked || !window.DOMPurify) {
                    throw new Error("The Markdown libraries could not be loaded. Check your internet connection or CDN access.");
                }

                const renderedHTML = window.marked.parse(markdown, {
                    gfm: true,
                    breaks: false
                });

                const safeHTML = window.DOMPurify.sanitize(renderedHTML, { USE_PROFILES: { html: true } });

                main.innerHTML = `
                    <div class="writing-viewer">
                        <article class="writing-content">
                            ${safeHTML}
                        </article>

                        <div class="writing-navigation">
                            <button class="back-link" onclick="previousWriting()"
                                ${currentWritingIndex === 0 ? "disabled" : ""}>Previous</button>
                            <button class="back-link" onclick="nextWriting()"
                                ${currentWritingIndex === writings.length - 1 ? "disabled" : ""}>Next</button>
                        </div>
                    </div>
                `;
            } catch (error) {
                if (requestId !== writingRequestId) return;
                console.error(error);

                const content = main.querySelector(".writing-content");
                if (content) {
                    content.innerHTML = `
                        <p class="writing-error">
                            Unable to load this article. Please check that the Markdown file exists at
                            <code>${writing.file}</code> and that the site is being served over HTTP/HTTPS.
                        </p>
                    `;
                }
            }
        }

        function previousWriting() {
            if (currentWritingIndex > 0) {
                currentWritingIndex--;
                showWritingArticle();
            }
        }

        function nextWriting() {
            if (currentWritingIndex < writings.length - 1) {
                currentWritingIndex++;
                showWritingArticle();
            }
        }


        /* ==================================================
           KEYBOARD NAVIGATION
        ================================================== */

        document.addEventListener("keydown", function (event) {

            if (currentPage === "photo") {

                if (event.key === "ArrowLeft") {
                    previousPhoto();
                }

                if (event.key === "ArrowRight") {
                    nextPhoto();
                }
            }

            if (currentPage === "writing" && !event.metaKey && !event.ctrlKey && !event.altKey) {

                if (event.key === "ArrowLeft") {
                    event.preventDefault();
                    previousWriting();
                }

                if (event.key === "ArrowRight") {
                    event.preventDefault();
                    nextWriting();
                }
            }

        });


        /* ==================================================
           INITIAL PAGE
        ================================================== */

        showPhotography();

    </script>
