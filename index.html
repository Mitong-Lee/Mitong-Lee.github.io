<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitong Li</title>

    <style>
        /* =========================
   BASIC
========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            font-weight: 400;
        }

        a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            font: inherit;
        }

        /* =========================
   MAIN LAYOUT
========================= */

        .site {
            width: min(716px, calc(100% - 40px));
            margin: 0 auto;
        }

        header {
            height: 58px;
            border-bottom: 1px solid #dedede;
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .site-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 23px;
        }

        nav a {
            color: #555;
            transition: color 0.15s ease;
        }

        nav a:hover,
        nav a.active {
            color: #000;
        }

        main {
            padding-top: 62px;
            padding-bottom: 100px;
        }

        /* =========================
   PHOTOGRAPHY DIRECTORY
========================= */

        .directory {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 54px;
            row-gap: 28px;
            align-items: start;
        }

        .project {
            cursor: pointer;
            min-width: 0;
        }

        .project-image {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f4f4f4;
        }

        .project-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.2s ease;
        }

        .project:hover .project-image img {
            opacity: 0.82;
        }

        .project-title {
            margin-top: 9px;
            color: #444;
            font-size: 11px;
            line-height: 1.4;
        }

        /* =========================
   PHOTO VIEWER
========================= */

        .viewer {
            width: 100%;
            text-align: center;
        }

        .viewer-heading {
            margin: 0 0 30px;
            font-size: 12px;
            font-weight: 400;
            color: #444;
        }

        /* PHOTO VIEWER */

        .viewer {
            width: 100%;
            text-align: center;
        }

        /* Fixed viewing area */

        /* PHOTO STAGE */

        .photo-stage {
            width: 100%;
            height: auto;
            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PHOTOGRAPH */

        .photo-stage img {
            display: block;

            width: auto;
            height: auto;

            max-width: 100%;
            max-height: 70vh;

            object-fit: contain;
        }

        /* Photograph information */

        .photo-info {
            width: 100%;
            margin: 12px auto 0;

            color: #777;
            font-size: 10px;
            line-height: 1.7;
            text-align: right;
        }

        .photo-navigation {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .photo-navigation button,
        .back-link {
            border: 0;
            padding: 0;
            background: transparent;
            color: #555;
            cursor: pointer;
            font-size: 11px;
        }

        .photo-navigation button:hover,
        .back-link:hover {
            color: #000;
        }

        .photo-navigation button:disabled {
            color: #ccc;
            cursor: default;
        }

        .viewer-back {
            margin-top: 22px;
        }

        /* =========================
   WRITING
========================= */

        .writing-list {
            max-width: 540px;
            margin: 0 auto;
        }

        .writing-viewer {
            max-width: 540px;
            margin: 0 auto;
        }

        .writing-content {
            font-size: 13px;
            line-height: 1.9;
            color: #333;
            white-space: pre-line;
        }

        .writing-navigation {
            margin-top: 42px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        /* =========================
   RESPONSIVE
========================= */

        @media (max-width: 600px) {
            .site {
                width: calc(100% - 36px);
            }

            header {
                gap: 18px;
            }

            nav {
                gap: 14px;
            }

            .directory {
                grid-template-columns: repeat(2, 1fr);
                column-gap: 24px;
                row-gap: 28px;
            }

            .project-image {
                height: 105px;
            }

            main {
                padding-top: 38px;
            }

            .photo-stage {
                min-height: 220px;
            }

            .photo-stage img {
                max-height: 65vh;
            }
        }

        @media (max-width: 360px) {
            header {
                gap: 12px;
            }

            nav {
                gap: 10px;
            }

            .site-name {
                font-size: 13px;
            }

            nav a {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

            /*

            {

                cover: "./image/winter/cover.webp",

                    {

                    }
                ]
            },
            */

        ];


        /* ==================================================
           WRITING DATABASE
        ================================================== */

        const writings = [

            {
                content: `This is a sample writing.

Replace this text with your own writing.

You can use multiple paragraphs by separating
them with line breaks.`
            },

            {
                content: `Another piece of writing.

The writing section uses the same simple
previous and next navigation.`
            }

        ];


        /* ==================================================
           STATE
        ================================================== */

        let currentPage = "directory";
        let currentProject = null;
        let currentPhotoIndex = 0;
        let currentWritingIndex = 0;

        const main = document.getElementById("main");

        // Image loading cache
        const preloadedPhotos = new Map();

        // Prevent outdated loading requests from replacing newer photographs
        let photoRequestId = 0;
        let pendingPhotoKey = null;


        /* ==================================================
           NAVIGATION HELPERS
        ================================================== */

        function setActiveNav(page) {

            document.getElementById("nav-photography")
                .classList.toggle("active", page === "photography");

            document.getElementById("nav-writing")
                .classList.toggle("active", page === "writing");
        }


        /* ==================================================
           PHOTOGRAPHY DIRECTORY
        ================================================== */

        function showPhotography() {

            currentPage = "directory";
            currentProject = null;

            setActiveNav("photography");

            let html = `<div class="directory">`;

            projects.forEach(project => {

                html += `
            <div class="project"
                 onclick="openProject('${project.id}')">

                <div class="project-image">
                    <img
                        src="${project.cover}"
                        alt="${project.title}"
                        loading="lazy"
                    >
                </div>

                <div class="project-title">
                    ${project.title}
                </div>

            </div>
        `;
            });

            html += `</div>`;

            main.innerHTML = html;

            window.scrollTo(0, 0);
        }


        /* ==================================================
           OPEN A PROJECT
        ================================================== */

        function openProject(projectId) {

            currentProject = projects.find(
                project => project.id === projectId
            );

            if (!currentProject) return;

            currentPhotoIndex = 0;

            showPhoto();
        }


        /* ==================================================
           PHOTO PRELOADING
        ================================================== */

        // Load a photograph in the background.
        // Reuse the image if it has already been requested.

        function preloadPhoto(src) {

            if (!src) return null;

            if (!preloadedPhotos.has(src)) {

                const image = new Image();

                image.decoding = "async";
                image.src = src;

                preloadedPhotos.set(src, image);
            }

            return preloadedPhotos.get(src);
        }


        // Wait until an image has loaded and is ready to display.

        function waitForPhoto(image) {

            if (!image) {
                return Promise.reject(new Error("Invalid image"));
            }

            if (image.complete) {

                if (image.naturalWidth === 0) {
                    return Promise.reject(
                        new Error("Image failed to load")
                    );
                }

                return (
                    image.decode
                        ? image.decode().catch(() => { }).then(() => image)
                        : Promise.resolve(image)
                );
            }

            return new Promise((resolve, reject) => {

                image.addEventListener("load", async function () {

                    try {
                        if (image.decode) {
                            await image.decode();
                        }
                    } catch (error) {
                        // The image has loaded; continue even if decode()
                        // is unavailable or rejects.
                    }

                    resolve(image);

                }, { once: true });


                image.addEventListener("error", function () {

                    reject(new Error("Image failed to load"));

                }, { once: true });

            });
        }


        // Keep only the current photograph and its neighbours in memory.

        function trimPhotoCache(photographs, index) {

            const keep = new Set([

                photographs[index - 1]?.src,
                photographs[index]?.src,
                photographs[index + 1]?.src

            ].filter(Boolean));


            for (const src of preloadedPhotos.keys()) {

                if (!keep.has(src)) {
                    preloadedPhotos.delete(src);
                }

            }

        }


        /* ==================================================
           PHOTO VIEWER
        ================================================== */

        function showPhoto(targetIndex = currentPhotoIndex) {

            const project = currentProject;

            if (!project) return;

            const photographs = project.photographs;

            if (
                targetIndex < 0 ||
                targetIndex >= photographs.length
            ) {
                return;
            }

            const photo = photographs[targetIndex];

            const requestKey = `${project.id}:${targetIndex}`;

            // Avoid starting the same request multiple times.
            if (pendingPhotoKey === requestKey) return;

            pendingPhotoKey = requestKey;

            // Identify this particular loading request.
            const requestId = ++photoRequestId;

            currentPage = "photo";

            setActiveNav("photography");


            // 1. Start loading the current photograph first.

            const targetImage = preloadPhoto(photo.src);


            // 2. Preload the previous photograph.

            const previous = photographs[targetIndex - 1];

            if (previous) {
                preloadPhoto(previous.src);
            }


            // 3. Preload the next photograph.

            const next = photographs[targetIndex + 1];

            if (next) {
                preloadPhoto(next.src);
            }


            // 4. Remove images outside the current three-photo window.

            trimPhotoCache(photographs, targetIndex);


            // 5. Wait for the target photograph.
            // The existing page remains visible during this process.

            waitForPhoto(targetImage)

                .then(image => {

                    // Ignore outdated requests.
                    if (
                        requestId !== photoRequestId ||
                        currentProject !== project
                    ) {
                        return;
                    }

                    pendingPhotoKey = null;

                    // Only update the index after the image is ready.
                    currentPhotoIndex = targetIndex;


                    // Render the new photograph.

                    main.innerHTML = `

                <div class="viewer">

                    <div class="photo-stage"></div>


                    <div class="photo-navigation">

                        <button
                            onclick="previousPhoto()"
                            ${targetIndex === 0 ? "disabled" : ""}
                        >
                            Previous
                        </button>

                        <button
                            onclick="nextPhoto()"
                            ${targetIndex === photographs.length - 1 ? "disabled" : ""}
                        >
                            Next
                        </button>

                    </div>

                </div>

            `;


                    // Reuse the already-loaded Image object.
                    // No need to request the image again.

                    image.alt = `${project.title} — ${targetIndex + 1}`;

                    const stage = main.querySelector(".photo-stage");

                    stage.appendChild(image);

                    // Add photograph information.

                    if (photo.info) {

                        const info = document.createElement("div");

                        info.className = "photo-info";
                        info.textContent = photo.info;

                        stage.insertAdjacentElement("afterend", info);

                    }


                    window.scrollTo(0, 0);

                })


                .catch(error => {

                    // Ignore errors from outdated requests.

                    if (
                        requestId !== photoRequestId ||
                        currentProject !== project
                    ) {
                        return;
                    }

                    pendingPhotoKey = null;

                    console.error("Failed to load photograph:", error);

                    // Keep the previously displayed photograph.
                    // Display an error message without clearing the page.

                    const container = main.querySelector(".viewer") || main;

                    let message = container.querySelector(".photo-load-error");

                    if (!message) {

                        message = document.createElement("div");

                        message.className = "photo-load-error";
                        message.style.marginTop = "16px";
                        message.style.color = "#999";
                        message.style.fontSize = "11px";

                        container.appendChild(message);

                    }

                    message.textContent = "Unable to load this photograph. Please try again.";

                });

        }


        /* ==================================================
           PREVIOUS / NEXT PHOTOGRAPH
        ================================================== */

        function previousPhoto() {

            if (
                currentProject &&
                currentPhotoIndex > 0
            ) {
                showPhoto(currentPhotoIndex - 1);
            }

        }


        function nextPhoto() {

            if (
                currentProject &&
                currentPhotoIndex < currentProject.photographs.length - 1
            ) {
                showPhoto(currentPhotoIndex + 1);
            }

        }


        /* ==================================================
           WRITING DIRECTORY
        ================================================== */

        function showWriting() {

            currentPage = "writing";

            setActiveNav("writing");

            currentWritingIndex = 0;

            showWritingArticle();
        }


        /* ==================================================
           WRITING VIEWER
        ================================================== */

        function showWritingArticle() {

            currentPage = "writing";

            const writing = writings[currentWritingIndex];

            if (!writing) {
                main.innerHTML = "";
                return;
            }

            main.innerHTML = `

        <div class="writing-viewer">

            <div class="writing-content">${writing.content}</div>

            <div class="writing-navigation">

                <button
                    class="back-link"
                    onclick="previousWriting()"
                    ${currentWritingIndex === 0 ? "disabled" : ""}
                >
                    Previous
                </button>

                <button
                    class="back-link"
                    onclick="nextWriting()"
                    ${currentWritingIndex === writings.length - 1 ? "disabled" : ""}
                >
                    Next
                </button>

            </div>

        </div>

    `;

            window.scrollTo(0, 0);
        }


        function previousWriting() {

            if (currentWritingIndex > 0) {
                currentWritingIndex--;
                showWritingArticle();
            }
        }


        function nextWriting() {

            if (currentWritingIndex < writings.length - 1) {
                currentWritingIndex++;
                showWritingArticle();
            }
        }


        /* ==================================================
           KEYBOARD NAVIGATION
        ================================================== */

        document.addEventListener("keydown", function (event) {

            if (currentPage === "photo") {

                if (event.key === "ArrowLeft") {
                    previousPhoto();
                }

                if (event.key === "ArrowRight") {
                    nextPhoto();
                }
            }

            if (currentPage === "writing") {

                if (event.key === "ArrowLeft") {
                    previousWriting();
                }

                if (event.key === "ArrowRight") {
                    nextWriting();
                }
            }

        });


        /* ==================================================
           INITIAL PAGE
        ================================================== */

        showPhotography();

    </script>
